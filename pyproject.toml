[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "aidial-analytics-realtime"
version = "0.24.1"
description = "Realtime analytics server for AI DIAL"
authors = [{ name = "EPAM RAIL", email = "SpecialEPM-DIALDevTeam@epam.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://epam-rail.com"
Repository = "https://github.com/epam/ai-dial-analytics-realtime"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
aiohttp = "3.14.0"
fastapi = "0.135.1"
starlette = ">=1.3.1,<2"
uvicorn = "0.22.0"
influxdb-client = "1.37.0"
langid = "1.1.6"
bertopic = "^0.15.0"
python-dotenv = "^1.2.2"
python-dateutil = "^2.8.2"
pydantic = "2.7.0"
aidial-sdk = { version = "0.33.1", extras = ["telemetry"] }

# Indirect dependencies
torch = [
    { version = "2.10.0", source = "PyPI", markers = "sys_platform == 'darwin'" },
    { version = "2.10.0+cpu", source = "pytorch", markers = "sys_platform != 'darwin'" },
]
transformers = "5.3.0"
llvmlite = "0.42.0"
numpy = "1.26.0"
numba = "0.59.1"
sentencepiece = "0.2.1"
pandas = "2.2.0"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
httpx = "^0.25.2"
httpx2 = "^2.0.0"
pytest-env = "1.1.1"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.1"

[tool.poetry.group.nox.dependencies]
nox = "^2023.4.22"

[tool.poetry.group.lint.dependencies]
pyright = "^1.1.325"
ruff = "^0.15.8"

[tool.pyright]
typeCheckingMode = "basic"
reportUnusedVariable = "error"
reportIncompatibleMethodOverride = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
env = ["LOG_LEVEL=DEBUG"]
markers = [
    "with_external: marks tests may require external resources, like the download models (deselect with '-m \"not with_external\"')",
]
filterwarnings = [
    "error",
    "ignore:Tensorflow not installed; ParametricUMAP will be unavailable:ImportWarning:umap:9",
    "ignore::DeprecationWarning:bertopic._bertopic:17",
    "ignore:.*datetime\\.datetime\\.utcfromtimestamp\\(\\) is deprecated and scheduled for removal in a future version*:DeprecationWarning",
    "ignore:.*Tensorflow not installed; ParametricUMAP will be unavailable:ImportWarning",
    # Ignoring warning from SWIG in order to avoid segmentation fault errors
    # occurring during the pytest tear down: https://github.com/google/sentencepiece/issues/1145
    "ignore:.*(SwigPyPacked|SwigPyObject|swigvarlink).*:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = [
    "ERA",  # flake8-eradicate
    "B",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "B9",   # flake8-bugbear
    "E",    # pycodestyle
    "W",    # pycodestyle
    "F",    # pyflakes
    "I",    # flake8-isort
    "S",    # flake8-bandit
    "FURB", # refurb
    "UP",   #  pyupgrade
]
ignore = [
    "S101", # Use of `assert` detected
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B008", # Do not perform function call in argument defaults
    "E501", # string literal is too long
    "B006", # Do not use mutable data structures for argument defaults
]
